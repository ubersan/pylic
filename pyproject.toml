[project]
name = "pylic"
version = "5.0.1"
description = "A Python license checker"
readme = "README.md"
authors = [
    { name = "Sandro Huber", email = "sandrochuber@gmail.com" }
]
keywords = ["cli", "license", "checker", "spdx"]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "license-expression>=30.4.1",
    "toml>=0.10.2",
    "typer>=0.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.10",
    "rust-just>=1.59.0",
    "ty>=0.0.95",
    "types-toml>=0.10.8.20240310",
]

[project.scripts]
pylic = "pylic.main:main"

[tool.pylic]
safe_licenses = [
    "Apache-2.0",
    "Apache Software License",
    "BSD License",
    "BSD-2-Clause",
    "CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "MIT",
    "MIT License",
    "Python Software Foundation License",
    "ISC License (ISCL)"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ERA",
    "YTT",
    "ANN",
    "BLE",
    "B",
    "C4",
    "ISC",
    "G",
    "PYI",
    "Q",
    "RET",
    "SIM",
    "TC",
    "ARG",
    "PTH",
    "I",
    "E",
    "W",
    "F",
    "UP",
    "FURB",
    "RUF"
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
